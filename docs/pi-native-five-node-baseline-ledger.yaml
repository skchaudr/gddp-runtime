failure_escalation:
  default: A failed, blocked, or contradicted packet stops only its transitive dependents; unrelated ready siblings continue when their isolation and gates remain valid.
  classes:
    - condition: Hash/definition drift during a live proof.
      action: Stop the proof, preserve all evidence, mark the attempt invalid-for-current-epoch, and request Sab's between-epoch decision; do not overwrite prior receipts.
    - condition: Production intake remains unhealthy after N00-W01B or requires forbidden repair.
      action: Mark production baseline blocked, preserve health outputs, and let read-only definition work continue; do not begin a proof that depends on the broken service.
    - condition: Missing local agent, agent-bus peer, credential, or evaluator capability.
      action: Mark blocked-capability; do not fabricate a semantic result. Optional peer audits may be degraded only when the packet does not require all lanes; required triple-audit packets wait for Sab to waive/re-route explicitly.
    - condition: Live actor/observer detects duplicate evaluation, cross-node evidence, capacity breach, or manual repair need.
      action: Stop the affected live proof immediately, preserve DB/ref/log state, block Node 4/5 dependents, and create a bounded corrective proposal rather than retrying the same proof.
    - condition: Writer scope breach or shared-path/isolation conflict.
      action: Stop the later/conflicting writer, preserve branch state, do not merge it, and require a new packet with corrected path ownership.
    - condition: Test/verification failure.
      action: Permit at most one bounded corrective pass when the packet explicitly owns the failing surface; otherwise checkpoint failed-verification with command output and escalate to parent/Sab.
    - condition: Stale Factory or validator assertion conflicts with the current human-approved packet hash.
      action: Preserve it as historical evidence, record the supersession link, and validate only the current epoch contract.
    - condition: Any request for reset, deletion, forced worktree removal, DB repair, or graph mutation by an agent.
      action: Stop and escalate to Sab; no packet authorizes it.
  retry_rule: Retries append a new attempt receipt with a new attempt identity; they never rewrite a failed receipt or make a failed executor attempt invisible.
exact_resume_point: Start N00-W01A and N00-W01C concurrently. After their receipts, run N00-W01B only with Sab's production-service authorization and N00-W02A as the read-only definition review; then stop for N00-W03A before any Node 1 or Node 2 execution.
