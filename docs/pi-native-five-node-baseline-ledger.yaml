operating_model:
  control: Parent Pi remains in the primary runtime checkout for coordination only; Pi subagent primitives select the smallest topology per packet and children do not orchestrate children.
  writers: Concurrent writers are required where this ledger names them, each owns one isolated git worktree and branch, and parent integration is a separate packet.
  advisors:
    codex: Agent-bus advisor/auditor for code, execution trace, tests, and diff claims; it has no graph authority.
    claude: Agent-bus advisor/auditor for architecture, intent, canonical-context, and integrity claims; it has no graph authority.
    rule: Peer outputs are cited evidence; peer silence is unavailable evidence, never approval.
  evidence_root: /Users/sab-mini/repos/gddp-runtime/.handoffs/artifacts/five-node-baseline/
  receipt_rule: Every packet writes an immutable attempt receipt under the evidence root with command output, hashes, changed paths, limits, and exact resume point before its worktree may be retired.
  graph_epochs:
    rule: project.yaml is immutable throughout one live-proof epoch; record its SHA-256 before dispatch and after every proof action.
    transition: An intentional Sab graph/config change occurs only between epochs, receives a new recorded project.yaml SHA-256 plus Sab decision record, and invalidates no earlier receipt identity.
    validator_contract: Validators consume the current Sab-approved node-definition hash and packet hash for their epoch; validators tied to superseded hashes remain historical evidence and cannot block the current epoch.
  live_safety:
    - No reset, delete, forced cleanup, manual database repair, or evidence removal.
    - Runtime jobs stop at awaiting_review; no packet auto-completes a node.
    - Live observers are read-only and never run an extra dispatch, reconcile, or heartbeat tick.
    - Existing valid receipts are reused; rerun only a named missing criterion or a proof invalidated by a recorded epoch change.
  factory_lessons:
    contract_version_coevolution: A node definition rewrite and its validator assertions are one transaction. Any simplify/re-scope decision must list invalidated assertion IDs before acceptance; validators bind only to the declared contract version/hash for the current epoch (see graph_epochs.validator_contract). Superseded contracts remain historical evidence and never gate the current epoch.
    async_steering: Packet dispatch returns immediately; worker events stream to the parent; an interrupt pauses the worker only and never collapses the parent loop; resume is one explicit action. Blocking dispatch without a steering channel is forbidden.
    worker_handoff_receipts: Every completed or failed worker returns a Factory-shaped handoff receipt under the evidence root with salientSummary, whatWasImplemented, whatWasLeftUndone, verification.commandsRun[] (command + exit code), discoveredIssues[] (severity + suggestedFix), and skillFeedback. This is the Pi worker return contract.
    typed_progress_log: Parent maintains an append-only typed progress log (worker_started/worker_completed with session ids, commit ids, validatorsPassed/failed, and resume point). Reconstructability is required; free-form chat is not a substitute.
    environment_baselining_and_scoped_gates: Gates run only the node-relevant subset. Pre-existing reds are baselined at packet creation and diffed against the worker; env allowlists prevent evaluator/subprocess leakage (e.g. GDDP_EXECUTOR_OVERRIDE) from becoming false gates. Full-suite reds outside packet ownership are baseline, not worker failure.
    no_false_semantic_verdicts_from_provider_failure: Provider 429/quota, peer silence, harness crash, spawn flake, or missing capability is blocked-capability or unavailable evidence, never a semantic fail/pass on the node. Do not invent acceptance, rejection, or criterion scores from infrastructure failure.
milestones:
  - id: M0
    outcome: Current production/runtime truth, agent capability, and five-definition authority are frozen into an executable starting epoch.
    evidence: N00-W01A, N00-W01B, N00-W01C, N00-W02A, and Sab's N00-W03A decision record.
  - id: M1
    outcome: Node 1 is explicitly retained as deferred policy or re-scoped by Sab from a criterion-level, two-adapter evidence bundle.
    evidence: N01-W01A through N01-W04A.
  - id: M2
    outcome: Node 2 has one real, unoverridden local-agent round trip ending at awaiting_review with durable, independently observed evidence.
    evidence: N02-W01A through N02-W04A.
  - id: M3
    outcome: Node 3 has criterion and canonical-context evidence, reusing the Node 2 receipt unless a named criterion is missing.
    evidence: N03-W01A through N03-W04A.
  - id: M4
    outcome: Node 4 has isolated implementation, controlled two-real-node concurrent execution/evaluation proof, and a Sab decision.
    evidence: N04-W01A through N04-W07A.
  - id: M5
    outcome: Node 5 has an audited derived frontier surface and an epoch-bounded before/after proof around a Sab acceptance.
    evidence: N05-W01A through N05-W04A.
  - id: M6
    outcome: A final manifest, independent validation, retirement inventory, and Sab baseline hash make the five-node result resumable and auditable.
    evidence: N99-W01A through N99-W03A.
completion:
  owner: Sab
  evidence: A signed-by-decision final bundle containing all packet receipts, current node-definition and project.yaml hashes per epoch, live proof traces, final validation, and the N99-W02A triple audit.
  decision_options: [accept-baseline, accept-with-deferred-node1-policy, revise, split, supersede, defer, abandon]
  invariant: Completion records graph truth only after Sab's decision; it is never inferred from all packets being checkpointed.
ready_frontier:
  checked_at_epoch: E0
  ready:
    - N00-W01A
    - N00-W01C
  held:
    - N00-W01B: awaits N00-W01A snapshot and Sab's live-service authorization.
    - N00-W02A: awaits the snapshot so reviewers receive a fixed source/hash set.
    - N00-W03A: awaits M0 evidence and is Sab-only.
  blocked_by_node_dag:
    - N01 preparation follows M0 definition/dependency decision.
    - N02 live dispatch follows the Node 1 policy decision and N02-W01C live gate.
    - N03 formal decision follows Node 2's Sab decision.
    - N04 follows Node 2 and Node 3 Sab decisions.
    - N05 follows Node 3 and Node 4 Sab decisions.
    - M6 follows all five node decisions and final epoch recording.
