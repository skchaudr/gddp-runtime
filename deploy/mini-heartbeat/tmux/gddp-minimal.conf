# gddp-minimal.conf — flat watch rig: no inactive dimming, minimal chrome.
# Used by watch-dispatch.sh via: tmux -f <this-file>
# Plugins from your main ~/.tmux.conf are intentionally not loaded here.

set -g default-terminal "screen-256color"
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1

# No inactive dimming — windows and panes stay full contrast.
set -g window-style 'default'
set -g window-active-style 'default'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour12'
setw -g pane-border-lines single

# Minimal status bar.
set -g status-position top
set -g status-style 'bg=colour235,fg=colour245'
set -g status-left-length 24
set -g status-left '#[fg=colour12]#S '
set -g status-right-length 32
set -g status-right '#[fg=colour245]%H:%M '
setw -g window-status-current-style 'fg=colour12,bg=default'
setw -g window-status-style 'fg=colour245,bg=default'

setw -g automatic-rename off
set -g set-titles off
setw -g monitor-activity off
set -g history-limit 5000
setw -g mode-keys vi